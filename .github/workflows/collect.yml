name: Deye 수집 및 Pages 배포

on:
  schedule:
    - cron: "*/5 * * * *"      # 5분마다 (UTC 기준, GitHub 사정으로 몇 분 늦어질 수 있음)
  workflow_dispatch:           # Actions 탭에서 수동 실행 버튼
  push:
    branches: [main]
    paths: ["index.html", "collector.py", ".github/workflows/collect.yml"]

permissions:
  contents: write              # data/ 커밋
  pages: write                 # Pages 배포
  id-token: write              # Pages 배포 인증

concurrency:
  group: deye-collect
  cancel-in-progress: false    # 겹치면 줄 세우기 (커밋 충돌 방지)

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DEYE_APP_ID: ${{ secrets.DEYE_APP_ID }}
      DEYE_APP_SECRET: ${{ secrets.DEYE_APP_SECRET }}
      DEYE_EMAIL: ${{ secrets.DEYE_EMAIL }}
      DEYE_PASSWORD: ${{ secrets.DEYE_PASSWORD }}
      DEYE_REGION: ${{ vars.DEYE_REGION || 'eu' }}
      DEYE_STATION_ID: ${{ vars.DEYE_STATION_ID }}
      DEYE_DEVICE_SN: ${{ vars.DEYE_DEVICE_SN }}
      DATA_PASSPHRASE: ${{ secrets.DATA_PASSPHRASE }}
      DATA_PASSPHRASE_OLD: ${{ secrets.DATA_PASSPHRASE_OLD }}
      DEYE_REQUIRE_ENCRYPTION: "1"       # 비밀번호가 없으면 평문으로 쓰지 않고 실패
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          ref: main                    # 대기열에서 늦게 시작해도 '지금' 최신 main 을 받는다 (예약 시점의 옛 커밋 X)
          fetch-depth: 1

      - name: 오늘 날짜 (캐시 키)
        id: d
        run: echo "day=$(TZ=Asia/Seoul date '+%Y%m%d')" >> "$GITHUB_OUTPUT"

      - name: 토큰·장비 캐시 복원 (키가 날짜라 토큰 발급은 하루 1회)
        uses: actions/cache@v4
        with:
          path: .cache
          key: deye-cache-${{ steps.d.outputs.day }}
          restore-keys: |
            deye-cache-

      - name: 암호화 라이브러리 설치
        run: python3 -m pip install --quiet --disable-pip-version-check cryptography==46.0.7

      - name: 수집 실행
        run: python3 collector.py

      - name: 변경분 커밋
        run: |
          git config user.name "deye-collector"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -q -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            if git push -q; then echo "push 완료"; exit 0; fi
            # 그사이 다른 실행이 먼저 올렸다 → 최신 main 위에서 다시 수집 (암호화 파일은 자동 병합이 안 된다)
            echo "원격이 앞서 있음 → 최신 상태에서 다시 수집 ($i/3)"
            git fetch -q origin main
            git reset -q --hard origin/main
            python3 collector.py
            git add data/
            if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
            git commit -q -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          done
          # 여기까지 오면 이 실행의 데이터는 낡았을 수 있으므로 배포하지 않는다
          echo "::error::push 3회 실패 — 낡은 데이터를 배포하지 않도록 이번 실행을 멈춥니다"
          exit 1

      - name: Pages 아티팩트 준비
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r data _site/
          touch _site/.nojekyll

      - name: Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
