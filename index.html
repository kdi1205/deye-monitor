<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5kW 목업 모니터링</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 무채색 + 색 3개: PV(호박), 부하(파랑), 경고(빨강 — 오류·오프라인일 때만) */
  :root{
    --bg:#F6F6F6; --panel:#FFFFFF; --ink:#171717; --sub:#525252; --mut:#8A8A8A; --line:#E6E6E6; --soft:#F0F0F0;
    --pv:#D4961C; --load:#3D6FD6; --warn:#D14343;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#111111; --panel:#181818; --ink:#EDEDED; --sub:#BDBDBD; --mut:#8C8C8C; --line:#2A2A2A; --soft:#202020;
      --pv:#E3AE47; --load:#7097EA; --warn:#E36A6A;
    }
  }
  :root[data-theme="dark"]{
    --bg:#111111; --panel:#181818; --ink:#EDEDED; --sub:#BDBDBD; --mut:#8C8C8C; --line:#2A2A2A; --soft:#202020;
    --pv:#E3AE47; --load:#7097EA; --warn:#E36A6A;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
    font-size:14px;line-height:1.5;word-break:keep-all}
  .num{font-variant-numeric:tabular-nums}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px}

  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 0 14px}
  header h1{margin:0;font-size:17px;font-weight:650;letter-spacing:-.01em}
  header .meta{display:flex;align-items:center;gap:14px;color:var(--mut);font-size:12.5px}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mut);margin-right:6px;vertical-align:1px}
  .dot.ok{background:var(--ink)} .dot.bad{background:var(--warn)}
  .link{font:inherit;color:var(--mut);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .link:hover{color:var(--ink)}

  .alert{display:none;margin:0 0 14px;padding:10px 14px;border-radius:8px;background:var(--panel);border:1px solid var(--warn);color:var(--warn);font-size:13px}
  .alert.show{display:block}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr)}
  .stat{padding:18px 20px 16px;border-left:1px solid var(--line)}
  .stat:first-child{border-left:0}
  .stat .k{font-size:12.5px;color:var(--mut);display:flex;align-items:center;gap:6px}
  .stat .k i{display:inline-block;width:8px;height:8px;border-radius:2px}
  .stat .v{font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1.15;margin-top:6px}
  .stat .v small{font-size:14px;font-weight:500;color:var(--mut);margin-left:3px;letter-spacing:0}
  .stat .s{font-size:12px;color:var(--mut);margin-top:4px}

  section{margin-top:14px}
  .phead{display:flex;justify-content:space-between;align-items:baseline;padding:14px 20px 0}
  .phead h2{margin:0;font-size:13.5px;font-weight:600}
  .legend{display:flex;gap:14px;color:var(--mut);font-size:12px}
  .legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:3px}
  .chart{position:relative;height:280px;padding:8px 12px 12px}
  .chart.s{height:200px}

  details{padding:0}
  details summary{list-style:none;cursor:pointer;padding:14px 20px;font-size:13.5px;font-weight:600;display:flex;justify-content:space-between}
  details summary::-webkit-details-marker{display:none}
  details summary::after{content:"펼치기";font-weight:400;color:var(--mut);font-size:12px}
  details[open] summary::after{content:"접기"}
  .kv{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--line)}
  .kv div{display:flex;justify-content:space-between;gap:12px;padding:9px 20px;border-bottom:1px solid var(--soft);font-size:13px}
  .kv div span:first-child{color:var(--mut)}
  .raw{padding:12px 20px 16px;border-top:1px solid var(--line)}
  .raw table{border-collapse:collapse;width:100%;font-size:12px}
  .raw td{padding:4px 8px 4px 0;border-bottom:1px solid var(--soft);color:var(--sub)}
  .raw td:last-child{text-align:right;padding-right:0}
  .rawwrap{overflow-x:auto}

  footer{color:var(--mut);font-size:12px;padding:18px 0 32px}

  .lock{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
  .lock[hidden]{display:none}
  .lock form{width:100%;max-width:340px;display:grid;gap:12px}
  .lock h2{margin:0 0 2px;font-size:18px;font-weight:650}
  .lock p{margin:0 0 6px;color:var(--mut);font-size:13px}
  .lock input[type=password]{font:inherit;font-size:15px;padding:11px 13px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);width:100%}
  .lock label{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mut)}
  .lock button{font:inherit;font-weight:600;padding:11px;border-radius:8px;border:0;background:var(--ink);color:var(--bg);cursor:pointer}
  .lock button[disabled]{opacity:.55;cursor:progress}
  .lock .err{color:var(--warn);font-size:13px;min-height:1.2em}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  @media (max-width:760px){
    .wrap{padding:0 16px}
    .stats{grid-template-columns:repeat(2,1fr)}
    .stat:nth-child(3){border-left:0}
    .stat:nth-child(n+3){border-top:1px solid var(--line)}
    .stat .v{font-size:28px}
    .kv{grid-template-columns:1fr}
    header{flex-wrap:wrap}
    .chart{height:240px}
  }
</style>
</head>
<body>
<div class="lock" id="lock">
  <form id="lockForm" autocomplete="off">
    <h2>5kW 목업 모니터링</h2>
    <p>비밀번호를 입력하세요.</p>
    <input type="password" id="pw" placeholder="비밀번호" autocomplete="current-password" required>
    <label><input type="checkbox" id="remember" checked> 이 브라우저에서 기억</label>
    <button type="submit" id="unlockBtn">열기</button>
    <div class="err" id="lockErr" role="alert"></div>
  </form>
</div>

<div class="wrap">
  <header>
    <h1>5kW 목업 <span id="station" style="color:var(--mut);font-weight:400"></span></h1>
    <div class="meta">
      <span><span class="dot" id="dot"></span><span id="online">연결 확인 중</span></span>
      <span class="num" id="dataTime"></span>
      <button class="link" id="lockBtn" type="button">잠그기</button>
    </div>
  </header>

  <div class="alert" id="alert" role="status"></div>

  <div class="panel stats">
    <div class="stat"><div class="k"><i style="background:var(--pv)"></i>PV 발전</div><div class="v num"><span id="pvPower">—</span><small>W</small></div><div class="s num" id="pvSub">—</div></div>
    <div class="stat"><div class="k"><i style="background:var(--load)"></i>부하</div><div class="v num"><span id="loadPower">—</span><small>W</small></div><div class="s num" id="loadSub">—</div></div>
    <div class="stat"><div class="k"><i style="background:var(--ink)"></i>배터리</div><div class="v num"><span id="soc">—</span><small>%</small></div><div class="s num" id="batSub">—</div></div>
    <div class="stat"><div class="k">오늘 발전</div><div class="v num"><span id="pvToday">—</span><small>kWh</small></div><div class="s num" id="todaySub">—</div></div>
  </div>

  <section class="panel">
    <div class="phead">
      <h2>오늘</h2>
      <div class="legend"><span><i style="background:var(--pv)"></i>PV</span><span><i style="background:var(--load)"></i>부하</span><span><i style="background:var(--mut)"></i>배터리 %</span></div>
    </div>
    <div class="chart"><canvas id="chartToday" aria-label="오늘 PV·부하 전력과 배터리 잔량"></canvas></div>
  </section>

  <section class="panel">
    <div class="phead">
      <h2>최근 30일</h2>
      <div class="legend"><span><i style="background:var(--pv)"></i>발전 kWh</span><span><i style="background:var(--load)"></i>소비 kWh</span></div>
    </div>
    <div class="chart s"><canvas id="chartDaily" aria-label="최근 30일 일간 발전량과 소비량"></canvas></div>
  </section>

  <section class="panel">
    <details id="detail">
      <summary>상세 값</summary>
      <div class="kv num" id="kv"></div>
      <div class="raw">
        <div style="color:var(--mut);font-size:12px;margin-bottom:6px">인버터 원본 항목</div>
        <div class="rawwrap"><table class="num"><tbody id="rawBody"></tbody></table></div>
      </div>
    </details>
  </section>

  <footer>Deye Cloud → GitHub Actions(5분) → GitHub Pages · 인버터 측정값은 운영 참고용이며 계량 근거가 아닙니다 · <span class="num" id="updatedAt"></span></footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const fmt = (v, d=0) => (v===null||v===undefined||Number.isNaN(v)) ? '—' : Number(v).toLocaleString('ko-KR',{maximumFractionDigits:d,minimumFractionDigits:d});
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const bust = () => '?_=' + Math.floor(Date.now()/30000);
  const kstDay = (offset=0) => { const d=new Date(Date.now()+9*3600e3+offset*86400e3); return d.toISOString().slice(0,10); };
  const hhmm = iso => iso ? iso.replace('T',' ').slice(5,16) : '—';
  let chartToday, chartDaily;

  // ── 암호화 (collector.py 와 같은 형식: AES-256-GCM, PBKDF2-SHA256, AAD = 파일 경로) ──
  const ENC_TAG = 'aesgcm-pbkdf2-v1', CHECK_TEXT = 'deye-monitor-ok';
  const te = new TextEncoder(), td = new TextDecoder();
  const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const b64e = b => btoa(String.fromCharCode(...new Uint8Array(b)));
  let KEY = null, META = null;
  const store = {
    get(k){ try{ return localStorage.getItem(k) || sessionStorage.getItem(k); }catch(e){ return null; } },
    set(k,v,persist){ try{ (persist?localStorage:sessionStorage).setItem(k,v); }catch(e){} },
    del(k){ try{ localStorage.removeItem(k); sessionStorage.removeItem(k); }catch(e){} },
  };
  const storeKey = () => 'deyeKey:' + (META ? META.salt : '');

  async function rawFetch(path){
    const r = await fetch(path + bust(), {cache:'no-store'});
    if(!r.ok) throw new Error(path+' '+r.status);
    return r.json();
  }
  async function decryptEnv(env, aad, key){
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(env.iv), additionalData:te.encode(aad)}, key || KEY, b64d(env.ct));
    return td.decode(pt);
  }
  async function deriveKey(pass){
    const base = await crypto.subtle.importKey('raw', te.encode(pass.normalize('NFC')), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2', salt:b64d(META.salt), iterations:META.iter, hash:'SHA-256'},
      base, {name:'AES-GCM', length:256}, true, ['decrypt']);
  }
  async function keyOk(key){
    try{ return (await decryptEnv(META.check, 'check', key)) === CHECK_TEXT; }catch(e){ return false; }
  }
  async function getJSON(path){
    const obj = await rawFetch(path);
    if(obj && obj.enc === ENC_TAG){
      if(!KEY) throw new Error('locked');
      try{ return JSON.parse(await decryptEnv(obj, path)); }
      catch(e){ showLock('비밀번호가 바뀌었거나 데이터를 풀 수 없습니다. 다시 입력하세요.'); throw e; }
    }
    return obj;
  }
  function showLock(msg){
    KEY = null; store.del(storeKey());
    $('lock').hidden = false; $('lockErr').textContent = msg || ''; $('pw').value=''; $('pw').focus();
  }
  async function tryStoredKey(){
    const raw = store.get(storeKey());
    if(!raw) return false;
    try{
      const k = await crypto.subtle.importKey('raw', b64d(raw), {name:'AES-GCM'}, true, ['decrypt']);
      if(await keyOk(k)){ KEY = k; return true; }
    }catch(e){}
    store.del(storeKey()); return false;
  }

  // ── 화면 ──
  function setStatus(L){
    const st = L.status || {};
    $('dot').className = 'dot ' + (st.ok && st.logger_online ? 'ok' : 'bad');
    $('online').textContent = !st.ok ? '수집 실패' : (st.logger_online ? '온라인' : `${fmt(st.data_age_min)}분째 갱신 없음`);
    $('dataTime').textContent = st.data_time ? '데이터 ' + hhmm(st.data_time) : '';
    $('updatedAt').textContent = '수집 ' + hhmm(L.updated_at);
    $('station').textContent = L.station && L.station.name ? '· ' + L.station.name : '';
    const a = $('alert');
    if(!st.ok){ a.textContent = `수집 실패 ${st.consecutive_failures||1}회 연속 — ${st.error||''} (마지막 성공 값을 표시 중)`; a.classList.add('show'); }
    else if(!st.logger_online){ a.textContent = `로거 데이터가 ${fmt(st.data_age_min)}분 동안 갱신되지 않았습니다. 인버터 Wi-Fi나 공유기를 확인하세요.`; a.classList.add('show'); }
    else a.classList.remove('show');
  }

  function setValues(L){
    const d = L.data || {};
    const bp = d.battery_power_w;
    $('pvPower').textContent = fmt(d.pv_power_w);
    $('pvSub').textContent = `PV1 ${fmt(d.pv1_power_w)} · PV2 ${fmt(d.pv2_power_w)}`;
    $('loadPower').textContent = fmt(d.load_power_w);
    $('loadSub').textContent = `${fmt(d.load_voltage_v,1)} V · ${fmt(d.ac_frequency_hz,1)} Hz`;
    $('soc').textContent = fmt(d.battery_soc_pct);
    $('batSub').textContent = bp ? `${bp<0?'충전':'방전'} ${fmt(Math.abs(bp))} W · ${fmt(d.battery_voltage_v,1)} V` : `대기 · ${fmt(d.battery_voltage_v,1)} V`;
    $('pvToday').textContent = fmt(d.pv_today_kwh,1);
    $('todaySub').textContent = `소비 ${fmt(d.load_today_kwh,1)} kWh`;

    const rows = [
      ['PV1', `${fmt(d.pv1_voltage_v,1)} V · ${fmt(d.pv1_current_a,1)} A · ${fmt(d.pv1_power_w)} W`],
      ['PV2', `${fmt(d.pv2_voltage_v,1)} V · ${fmt(d.pv2_current_a,1)} A · ${fmt(d.pv2_power_w)} W`],
      ['누적 발전', `${fmt(d.pv_total_kwh,1)} kWh`],
      ['배터리', `${fmt(d.battery_voltage_v,2)} V · ${fmt(d.battery_current_a,1)} A · ${fmt(bp)} W`],
      ['배터리 온도', `${fmt(d.battery_temp_c,1)} °C`],
      ['오늘 충전 / 방전', `${fmt(d.charge_today_kwh,1)} / ${fmt(d.discharge_today_kwh,1)} kWh`],
      ['출력', `${fmt(d.load_voltage_v,1)} V · ${fmt(d.ac_frequency_hz,2)} Hz`],
      ['인버터 온도', `AC ${fmt(d.inverter_temp_ac_c,1)} °C`],
      ['누적 소비', `${fmt(d.load_total_kwh,1)} kWh`],
    ];
    $('kv').innerHTML = rows.map(([k,v]) => `<div><span>${k}</span><span>${v}</span></div>`).join('');
    const raw = L.raw || {}, units = L.units || {};
    $('rawBody').innerHTML = Object.keys(raw).sort().map(k => `<tr><td>${k}</td><td>${raw[k]} ${units[k]||''}</td></tr>`).join('');
  }

  function baseOpts(){
    Chart.defaults.color = css('--mut'); Chart.defaults.borderColor = css('--line');
    Chart.defaults.font.family = getComputedStyle(document.body).fontFamily; Chart.defaults.font.size = 11;
    return { responsive:true, maintainAspectRatio:false, animation:false, interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false}, tooltip:{backgroundColor:css('--ink'), titleColor:css('--bg'), bodyColor:css('--bg'), padding:8, boxPadding:4, usePointStyle:true}},
      elements:{point:{radius:0, hoverRadius:3}, line:{borderWidth:1.6, tension:0.3}} };
  }

  function drawToday(rows){
    const o = baseOpts();
    o.scales = {
      x:{grid:{display:false}, border:{display:false}, ticks:{maxTicksLimit:innerWidth<760?4:8, maxRotation:0, autoSkip:true}},
      y:{beginAtZero:true, border:{display:false}, ticks:{maxTicksLimit:5, callback:v=>fmt(v)+' W'}},
      y2:{position:'right', min:0, max:100, border:{display:false}, grid:{display:false}, ticks:{stepSize:50, callback:v=>v+'%'}},
    };
    const pv = css('--pv');
    if(chartToday) chartToday.destroy();
    chartToday = new Chart($('chartToday'), {type:'line', data:{labels:rows.map(r=>r.t), datasets:[
      {label:'PV', data:rows.map(r=>r.pv_power_w), borderColor:pv, backgroundColor:pv+'26', fill:true, yAxisID:'y'},
      {label:'부하', data:rows.map(r=>r.load_power_w), borderColor:css('--load'), yAxisID:'y'},
      {label:'배터리 %', data:rows.map(r=>r.battery_soc_pct), borderColor:css('--mut'), borderWidth:1.2, borderDash:[3,3], yAxisID:'y2'},
    ]}, options:o});
  }

  function drawDaily(daily){
    const days = Object.keys(daily).sort().slice(-30);
    const o = baseOpts();
    o.scales = {
      x:{grid:{display:false}, border:{display:false}, ticks:{maxTicksLimit:innerWidth<760?5:10, maxRotation:0, callback:(v,i)=>days[i].slice(5).replace('-','/')}},
      y:{beginAtZero:true, border:{display:false}, ticks:{maxTicksLimit:4}},
    };
    if(chartDaily) chartDaily.destroy();
    chartDaily = new Chart($('chartDaily'), {type:'bar', data:{labels:days, datasets:[
      {label:'발전', data:days.map(d=>daily[d].pv_today_kwh??null), backgroundColor:css('--pv'), borderRadius:2, maxBarThickness:14},
      {label:'소비', data:days.map(d=>daily[d].load_today_kwh??null), backgroundColor:css('--load'), borderRadius:2, maxBarThickness:14},
    ]}, options:o});
  }

  async function refreshLatest(){
    try{ const L = await getJSON('data/latest.json'); setStatus(L); setValues(L); }
    catch(e){ $('online').textContent='데이터 없음'; $('dot').className='dot bad'; console.warn(e); }
  }
  async function refreshHistory(){
    try{
      let rows = [];
      try{ rows = await getJSON('data/history/'+kstDay()+'.json'); }
      catch(e){ rows = await getJSON('data/history/'+kstDay(-1)+'.json').catch(()=>[]); }
      drawToday(rows);
    }catch(e){ console.warn(e); }
    try{ drawDaily(await getJSON('data/daily.json')); }catch(e){ console.warn(e); }
  }

  let started = false;
  function start(){
    $('lock').hidden = true;
    refreshLatest(); refreshHistory();
    if(started) return; started = true;
    setInterval(() => { if(KEY || !META) refreshLatest(); }, 60*1000);
    setInterval(() => { if(KEY || !META) refreshHistory(); }, 5*60*1000);
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if(KEY || !META) refreshHistory(); });
  }

  $('lockForm').addEventListener('submit', async ev => {
    ev.preventDefault();
    const btn = $('unlockBtn'); btn.disabled = true; btn.textContent = '확인 중…'; $('lockErr').textContent = '';
    try{
      const k = await deriveKey($('pw').value);
      if(await keyOk(k)){
        KEY = k;
        store.set(storeKey(), b64e(await crypto.subtle.exportKey('raw', k)), $('remember').checked);
        start();
      }else{
        $('lockErr').textContent = '비밀번호가 맞지 않습니다.';
        $('pw').select();
      }
    }catch(e){ $('lockErr').textContent = '확인 중 오류: ' + e.message; }
    btn.disabled = false; btn.textContent = '열기';
  });
  $('lockBtn').addEventListener('click', () => showLock('잠갔습니다.'));

  (async function init(){
    try{ META = await rawFetch('data/key.json'); }catch(e){ META = null; }
    if(!META || !META.check){ $('lockBtn').hidden = true; start(); return; }
    if(!window.crypto || !crypto.subtle){ showLock('이 브라우저는 암호 해제를 지원하지 않습니다 (https 주소로 접속하세요).'); return; }
    if(await tryStoredKey()) start(); else showLock();
  })();
})();
</script>
</body>
</html>
